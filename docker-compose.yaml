services:
  # Service สำหรับฐานข้อมูล PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      # อ่านค่าจากไฟล์ .env โดยอัตโนมัติ
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432" # เปลี่ยน port บนเครื่องเป็น 5435 เพื่อไม่ให้ชนกับ postgres อื่น
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

  # Service สำหรับแอปพลิเคชัน
  app:
    build:
      context: .
      target: production
    container_name: dockeeper-app
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env # บอกให้ service นี้อ่านค่าจากไฟล์ .env
    # ลบ volumes ส่วนนี้ออกทั้งหมด เพราะไม่จำเป็นสำหรับโหมด production
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    command: >
      sh -c "
        echo 'Running Prisma migrations for local startup...' &&
        npx prisma migrate deploy &&
        echo 'Seeding database for local startup...' &&
        npx prisma db seed &&
        echo 'Starting Next.js server...' &&
        npm run start
      "

volumes:
  postgres_data_local: